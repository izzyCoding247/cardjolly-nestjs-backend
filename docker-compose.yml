services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cardjolly
      POSTGRES_PASSWORD: cardjolly
      POSTGRES_DB: cardjolly_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardjolly -d cardjolly_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cardjolly
      POSTGRES_PASSWORD: cardjolly
      POSTGRES_DB: cardjolly_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardjolly -d cardjolly_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
